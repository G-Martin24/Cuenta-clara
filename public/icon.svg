<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#022c22" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Base background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Glass overlay card -->
  <rect x="64" y="64" width="384" height="384" rx="80" fill="url(#shield)" stroke="#ffffff" stroke-width="4" stroke-opacity="0.3" filter="url(#shadow)" />

  <!-- Center Circle for Checkmark -->
  <circle cx="256" cy="240" r="110" fill="#ffffff" />

  <!-- Teal Checkmark -->
  <path d="M196 238 L238 280 L322 196" fill="none" stroke="#0d9488" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Badge at bottom: ARG -->
  <rect x="186" y="380" width="140" height="42" rx="21" fill="#f59e0b" />
  <text x="256" y="408" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="3">CUENTAS</text>
</svg>
